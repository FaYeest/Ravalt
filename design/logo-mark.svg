<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Deep Obsidian Charcoal -->
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E22"/>
      <stop offset="45%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>

    <!-- Bevel Rim Highlight -->
    <linearGradient id="bevel-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#444450" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#24242A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#121216" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Brushed Satin Titanium Metal for R Stem & Loop -->
    <linearGradient id="satin-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#EDEDF2"/>
      <stop offset="70%" stop-color="#C8C8D4"/>
      <stop offset="100%" stop-color="#A2A2B0"/>
    </linearGradient>

    <!-- Vault Dial Concentric Metal -->
    <linearGradient id="dial-metal" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#E8E8EE"/>
      <stop offset="50%" stop-color="#BABAC6"/>
      <stop offset="100%" stop-color="#8E8E9C"/>
    </linearGradient>

    <!-- Vault Dial Core Aperture -->
    <radialGradient id="dial-aperture" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181C"/>
      <stop offset="75%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>

    <!-- Emerald Security Core Glow -->
    <radialGradient id="emerald-optic" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="85%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </radialGradient>

    <radialGradient id="ambient-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Letter R -->
    <filter id="r-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base Foundation (Adaptive App Icon Standard) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#obsidian-bg)" stroke="url(#bevel-rim)" stroke-width="3"/>
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow behind dial -->
  <circle cx="256" cy="236" r="140" fill="url(#ambient-aura)"/>

  <!-- Main Emblem Group with Shadow -->
  <g filter="url(#r-shadow)">
    <!-- Architectural Letter "R" Body -->
    <!-- Left Vertical Pillar -->
    <path d="M 140 124
             H 196
             V 388
             H 140
             Z"
          fill="url(#satin-titanium)"/>

    <!-- Upper Loop Section (Right of Pillar) -->
    <path d="M 196 124
             H 296
             C 356 124, 386 160, 386 216
             C 386 268, 354 298, 296 298
             H 196
             V 246
             H 292
             C 324 246, 338 232, 338 216
             C 338 198, 324 176, 292 176
             H 196
             Z"
          fill="url(#satin-titanium)"/>

    <!-- Diagonal Deadbolt Leg -->
    <path d="M 288 280
             L 366 388
             H 300
             L 236 296
             Z"
          fill="url(#satin-titanium)"/>
  </g>

  <!-- Precision Mechanical Vault Combination Dial (Integrated over counter) -->
  <g transform="translate(256, 236)">
    <!-- Outer Dial Rim Shadow & Base -->
    <circle cx="0" cy="0" r="76" fill="#141418" stroke="#33333C" stroke-width="2"/>
    <circle cx="0" cy="0" r="72" fill="url(#dial-metal)" stroke="#4A4A56" stroke-width="1.5"/>
    
    <!-- Vault Dial Calibration Track (Radial Tick Ring) -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#1E1E24" stroke-width="4" stroke-dasharray="2 5.85"/>
    <circle cx="0" cy="0" r="54" fill="#121216" stroke="#2A2A34" stroke-width="1.5"/>

    <!-- Four Cardinal Calibrated Alignment Marks -->
    <line x1="0" y1="-67" x2="0" y2="-59" stroke="#E2E2EA" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="59" x2="0" y2="67" stroke="#E2E2EA" stroke-width="2" stroke-linecap="round"/>
    <line x1="-67" y1="0" x2="-59" y2="0" stroke="#E2E2EA" stroke-width="2" stroke-linecap="round"/>
    <line x1="59" y1="0" x2="67" y2="0" stroke="#E2E2EA" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Top Index Marker (Small Triangle Indicator) -->
    <polygon points="0,-71 -4,-77 4,-77" fill="#E2E2EA"/>

    <!-- Inner Stepped Dial Tumbler Ring -->
    <circle cx="0" cy="0" r="44" fill="url(#dial-metal)" stroke="#525260" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="36" fill="url(#dial-aperture)" stroke="#222228" stroke-width="2"/>

    <!-- Inner Gear Knurl Ring -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#383842" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Zero-Knowledge Cryptographic Core (Emerald Indicator Optic) -->
    <circle cx="0" cy="0" r="16" fill="url(#emerald-optic)" stroke="#047857" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="13" fill="#10B981" opacity="0.6"/>
    
    <!-- Specular Highlight / Lens Reflection -->
    <ellipse cx="-4" cy="-4" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.85" transform="rotate(-30 -4 -4)"/>
    <circle cx="0" cy="0" r="3" fill="#A7F3D0" opacity="0.9"/>
  </g>
</svg>
