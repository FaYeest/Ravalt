<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ravalt Official Scalable Vector App Icon (Light Mode) -->
  <defs>
    <filter id="clean-light-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Crisp White Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="2.5"/>

  <!-- Center Monolith Group -->
  <g filter="url(#clean-light-shadow)">
    <!-- Left Pillar Stem -->
    <rect x="144" y="124" width="56" height="264" rx="8" fill="#121214"/>

    <!-- Upper Vault Arch -->
    <path d="M 192 124
             H 292
             C 348 124, 384 156, 384 208
             C 384 260, 348 292, 292 292
             H 192
             Z
             M 200 174
             H 286
             C 318 174, 334 188, 334 208
             C 334 228, 318 242, 286 242
             H 200
             Z"
          fill="#121214"
          fill-rule="evenodd"/>

    <!-- Vault Diagonal Deadbolt Leg -->
    <path d="M 264 256
             L 356 380
             C 362 388, 374 388, 380 380
             C 386 372, 386 360, 380 352
             L 298 244
             Z"
          fill="#121214"/>

    <!-- Zero-Knowledge Cryptographic Core -->
    <circle cx="266" cy="208" r="18" fill="#FFFFFF"/>
    <circle cx="266" cy="208" r="8" fill="#059669"/>
    <circle cx="266" cy="208" r="2.5" fill="#FFFFFF"/>

    <!-- Micro Precision Slit -->
    <rect x="144" y="205" width="16" height="6" rx="2" fill="#FFFFFF"/>
  </g>
</svg>
