<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept 3: Swiss Minimalist Monolith "R-Vault" -->
  <!-- Pure geometric minimalism inspired by Swiss typography & Dieter Rams -->
  <defs>
    <!-- Subtle drop shadow on the white glyph -->
    <filter id="clean-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Deep Matte Obsidian Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="#121214" stroke="#26262B" stroke-width="2.5"/>

  <!-- Center Monolith Group -->
  <g filter="url(#clean-shadow)">
    
    <!-- Left Pillar Stem -->
    <rect x="144" y="124" width="56" height="264" rx="8" fill="#FFFFFF"/>

    <!-- Upper Vault Arch (R Loop with Keyhole Aperture) -->
    <!-- Outer Arch -->
    <path d="M 192 124
             H 292
             C 348 124, 384 156, 384 208
             C 384 260, 348 292, 292 292
             H 192
             Z
             M 200 174
             H 286
             C 318 174, 334 188, 334 208
             C 334 228, 318 242, 286 242
             H 200
             Z"
          fill="#FFFFFF"
          fill-rule="evenodd"/>

    <!-- Vault Diagonal Deadbolt Leg -->
    <path d="M 264 256
             L 356 380
             C 362 388, 374 388, 380 380
             C 386 372, 386 360, 380 352
             L 298 244
             Z"
          fill="#FFFFFF"/>

    <!-- Zero-Knowledge Cryptographic Core (Circular Keyhole Aperture & Emerald Dot) -->
    <!-- Circular Tumbler Cutout in the counter -->
    <circle cx="266" cy="208" r="18" fill="#121214"/>
    <circle cx="266" cy="208" r="8" fill="#10B981"/>
    <circle cx="266" cy="208" r="2.5" fill="#FFFFFF"/>

    <!-- Micro Precision Slit (Vault Keyway notch) -->
    <rect x="144" y="205" width="16" height="6" rx="2" fill="#121214"/>
  </g>
</svg>
