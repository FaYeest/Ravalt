<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <!-- Ravalt Horizontal Brand Lockup (Pure Clean Vector) -->
  <!-- Left Icon Mark (76x76) -->
  <g transform="translate(22, 22)">
    <rect width="76" height="76" rx="18" fill="#121214" stroke="#26262B" stroke-width="1.5"/>
    
    <!-- Scaled R Vault Mark (Scale: 76/512 = ~0.1484) -->
    <g transform="translate(4, 4) scale(0.133)">
      <!-- Left Pillar -->
      <rect x="144" y="124" width="56" height="264" rx="8" fill="#FFFFFF"/>
      <!-- Loop -->
      <path d="M 192 124 H 292 C 348 124, 384 156, 384 208 C 384 260, 348 292, 292 292 H 192 Z M 200 174 H 286 C 318 174, 334 188, 334 208 C 334 228, 318 242, 286 242 H 200 Z"
            fill="#FFFFFF" fill-rule="evenodd"/>
      <!-- Leg -->
      <path d="M 264 256 L 356 380 C 362 388, 374 388, 380 380 C 386 372, 386 360, 380 352 L 298 244 Z" fill="#FFFFFF"/>
      <!-- Core -->
      <circle cx="266" cy="208" r="18" fill="#121214"/>
      <circle cx="266" cy="208" r="8" fill="#10B981"/>
      <rect x="144" y="205" width="16" height="6" rx="2" fill="#121214"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="120" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="4" fill="#FFFFFF">
    RAVALT
  </text>

  <text x="121" y="82" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="2.8" fill="#10B981">
    ZERO-KNOWLEDGE VAULT
  </text>

  <!-- Security Protocol Pill -->
  <g transform="translate(422, 42)">
    <rect width="72" height="22" rx="4" fill="#18181D" stroke="#2C2C36" stroke-width="1"/>
    <circle cx="12" cy="11" r="3" fill="#10B981"/>
    <text x="40" y="15" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#9999A5">ARGON2ID</text>
  </g>
</svg>
