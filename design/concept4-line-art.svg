<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept 4: Monoline Architectural Vault R -->
  <!-- Pure single-stroke vector geometry, ultra-clean and iconic -->
  <defs>
    <filter id="line-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="#121214" stroke="#26262B" stroke-width="2.5"/>

  <g filter="url(#line-glow)">
    <!-- Left Vertical Monolith Stem -->
    <line x1="168" y1="136" x2="168" y2="376" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Vault Arch & Leg Path (Continuous Stroke) -->
    <path d="M 168 152
             H 276
             C 336 152, 368 184, 368 232
             C 368 280, 336 308, 276 308
             H 176"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Deadbolt Diagonal Leg -->
    <line x1="264" y1="296" x2="356" y2="376" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Zero-Knowledge Cryptographic Core (Emerald Lock Pin) -->
    <circle cx="264" cy="230" r="14" fill="#10B981"/>
    <circle cx="264" cy="230" r="5" fill="#FFFFFF"/>
  </g>
</svg>
