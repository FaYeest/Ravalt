name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Version Information
        id: version
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          # Ensure tag starts with 'v' for standard release tagging
          if [[ "$RAW_TAG" =~ ^v ]]; then
            TAG="$RAW_TAG"
            CLEAN_VERSION="${RAW_TAG#v}"
          else
            TAG="v$RAW_TAG"
            CLEAN_VERSION="$RAW_TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Building Ravalt Release: Tag=$TAG, VersionName=$CLEAN_VERSION"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PVERSION_NAME="${{ steps.version.outputs.clean_version }}" \
            --no-daemon

      - name: Sign & Package APK
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$APK_DIR/app-release-unsigned.apk"
          SIGNED_APK="$APK_DIR/Ravalt-${TAG}.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Error: $UNSIGNED_APK not found!"
            exit 1
          fi

          # Locate apksigner from Android SDK build tools
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Signing with repository secret release keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            $APKSIGNER sign --ks release.keystore \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$SIGNED_APK" "$UNSIGNED_APK"
            rm -f release.keystore
          else
            echo "No custom keystore secrets found. Generating self-signed release key..."
            keytool -genkeypair -v \
              -keystore temp-release.keystore \
              -alias ravalt \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass ravaltpassword \
              -keypass ravaltpassword \
              -dname "CN=Ravalt Password Manager, OU=Mobile, O=Ravalt, L=Jakarta, ST=Jakarta, C=ID"

            $APKSIGNER sign --ks temp-release.keystore \
              --ks-key-alias ravalt \
              --ks-pass pass:ravaltpassword \
              --key-pass pass:ravaltpassword \
              --out "$SIGNED_APK" "$UNSIGNED_APK"
            rm -f temp-release.keystore
          fi

          echo "Verifying APK signature..."
          $APKSIGNER verify --verbose "$SIGNED_APK"

          echo "Generating SHA-256 checksum..."
          cd "$APK_DIR"
          sha256sum "Ravalt-${TAG}.apk" > "Ravalt-${TAG}.apk.sha256"
          echo "Checksum generated: $(cat Ravalt-${TAG}.apk.sha256)"

      - name: Publish GitHub Release with Changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Ravalt ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/Ravalt-${{ steps.version.outputs.tag }}.apk
            android/app/build/outputs/apk/release/Ravalt-${{ steps.version.outputs.tag }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
