name: Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Manual release version tag (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Manage Release PR & Tags
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Google Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple

  build-and-publish-apk:
    name: Build, Sign & Attach APK
    runs-on: ubuntu-latest
    needs: [release-please]
    if: |
      always() &&
      (
        needs.release-please.outputs.releases_created == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Target Version & Tag
        id: target
        shell: bash
        run: |
          if [ "${{ needs.release-please.outputs.releases_created }}" = "true" ]; then
            TAG="${{ needs.release-please.outputs.tag_name }}"
            CLEAN_VERSION="${{ needs.release-please.outputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            CLEAN_VERSION="${TAG#v}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.version_tag }}"
            if [[ "$RAW_TAG" =~ ^v ]]; then
              TAG="$RAW_TAG"
              CLEAN_VERSION="${RAW_TAG#v}"
            else
              TAG="v$RAW_TAG"
              CLEAN_VERSION="$RAW_TAG"
            fi
          else
            # Fallback to version.txt or default
            if [ -f "version.txt" ]; then
              CLEAN_VERSION=$(cat version.txt | tr -d '[:space:]')
            else
              CLEAN_VERSION="1.0.0"
            fi
            TAG="v$CLEAN_VERSION"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Target Release: Tag=$TAG, Version=$CLEAN_VERSION"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PVERSION_NAME="${{ steps.target.outputs.clean_version }}" \
            --no-daemon

      - name: Sign & Prepare APK
        shell: bash
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          APK_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$APK_DIR/app-release-unsigned.apk"
          SIGNED_APK="$APK_DIR/Ravalt-${TAG}.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Error: $UNSIGNED_APK not found!"
            exit 1
          fi

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Signing with repository secret keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            $APKSIGNER sign --ks release.keystore \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$SIGNED_APK" "$UNSIGNED_APK"
            rm -f release.keystore
          else
            echo "Signing with self-signed release keystore..."
            keytool -genkeypair -v \
              -keystore temp-release.keystore \
              -alias ravalt \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass ravaltpassword \
              -keypass ravaltpassword \
              -dname "CN=Ravalt Password Manager, OU=Mobile, O=Ravalt, L=Jakarta, ST=Jakarta, C=ID"

            $APKSIGNER sign --ks temp-release.keystore \
              --ks-key-alias ravalt \
              --ks-pass pass:ravaltpassword \
              --key-pass pass:ravaltpassword \
              --out "$SIGNED_APK" "$UNSIGNED_APK"
            rm -f temp-release.keystore
          fi

          echo "Verifying APK signature..."
          $APKSIGNER verify --verbose "$SIGNED_APK"

          echo "Generating SHA-256 checksum..."
          cd "$APK_DIR"
          sha256sum "Ravalt-${TAG}.apk" > "Ravalt-${TAG}.apk.sha256"
          echo "Checksum generated: $(cat Ravalt-${TAG}.apk.sha256)"

      - name: Publish Release Assets to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          APK_FILE="android/app/build/outputs/apk/release/Ravalt-${TAG}.apk"
          SHA_FILE="android/app/build/outputs/apk/release/Ravalt-${TAG}.apk.sha256"

          # Check if GitHub Release already exists (e.g. created by Release-Please)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading APK and checksum assets..."
            gh release upload "$TAG" "$APK_FILE" "$SHA_FILE" --clobber
          else
            echo "Release $TAG does not exist. Creating release and uploading assets..."
            gh release create "$TAG" "$APK_FILE" "$SHA_FILE" \
              --title "Ravalt $TAG" \
              --generate-notes
          fi
          echo "Release assets successfully published for $TAG!"
